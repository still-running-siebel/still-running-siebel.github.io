{{ define "main" }}
<article class="page">
  <p class="logline eyebrow">ObjMgrLog&nbsp;&nbsp;Info&nbsp;&nbsp;::&nbsp;&nbsp;{{ upper .Section | default "PAGE" }}</p>
  <h1>{{ .Title }}</h1>
  {{ if eq .Section "articles" }}<p class="post-date">{{ .Date.Format "January 2, 2006" }}</p>{{ end }}
  {{ with .Params.price }}<p class="price">{{ . }}</p>{{ end }}
  {{ .Content }}
  {{ with .Params.gumroad }}
  <p><a class="btn" href="{{ . }}">Buy on Gumroad</a></p>
  {{ end }}
</article>
{{ end }}
